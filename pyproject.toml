[project]
name = "obolus"
version = "0.2.2"
description = "An MCP server that gives an AI agent a disposable Algorand wallet, so it can pay for x402 resources"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "HEAVYMETA" }]
keywords = ["mcp", "x402", "algorand", "wallet", "agent", "payments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
]

# 3.11 for tomllib in the stdlib — network profiles are TOML and that should cost
# no dependency. See IMPLEMENTATION_PLAN.md, "Packaging".
requires-python = ">=3.11"

dependencies = [
    # PINNED DELIBERATELY. Every x402 claim in CLAUDE.md was measured on this exact
    # version against the live GoPlausible facilitator: the PAYMENT-SIGNATURE header
    # name, extra.tag nesting, and the signer's signature-envelope agnosticism. A
    # bump re-opens all of them.
    #
    # Client-side extras only. Authen also pulls [flask,extensions] because it is the
    # server; Obolus never serves a 402, it only answers them.
    "x402-avm[avm,httpx]==2.0.2",
    "httpx>=0.27",
    "pynacl>=1.6.2",
    "mcp>=2.0.0",
    "segno>=1.6.6",
    # Pillow was an optional [qr] extra on the argument that a wallet should not
    # carry an imaging stack. That was right for a library and wrong for an
    # installed application: without it `uvx obolus-mcp` produces unbranded,
    # uncaptioned codes and the whole "show me the QR" flow fails, and the fix
    # required users to type `--from 'obolus[qr]'`, which nobody does.
    "pillow>=11",
]

# Must come AFTER every bare key of [project]: a sub-table opened mid-table
# swallows everything below it, which is how `dependencies` briefly became a URL.
[project.urls]
Homepage = "https://github.com/inviti8/Obolus"
Repository = "https://github.com/inviti8/Obolus"
Issues = "https://github.com/inviti8/Obolus/issues"

[project.scripts]
obolus = "obolus.cli:main"
obolus-mcp = "obolus.mcp.server:main"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obolus"]

# The brand asset the QR renderer composites must ship with the wheel; without
# this the styled code silently loses its logo on an installed copy.
artifacts = ["obolus/assets/*.png"]
