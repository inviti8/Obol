[project]
name = "obol"
version = "0.1.0"
description = "An MCP server that gives an AI agent a disposable Algorand wallet for x402 payments"
readme = "README.md"
# 3.11 for tomllib in the stdlib — network profiles are TOML and that should cost
# no dependency. See IMPLEMENTATION_PLAN.md, "Packaging".
requires-python = ">=3.11"

dependencies = [
    # PINNED DELIBERATELY. Every x402 claim in CLAUDE.md was measured on this exact
    # version against the live GoPlausible facilitator: the PAYMENT-SIGNATURE header
    # name, extra.tag nesting, and the signer's signature-envelope agnosticism. A
    # bump re-opens all of them.
    #
    # Client-side extras only. Authen also pulls [flask,extensions] because it is the
    # server; Obol never serves a 402, it only answers them.
    "x402-avm[avm,httpx]==2.0.2",
    "httpx>=0.27",
    "pynacl>=1.6.2",
    "mcp>=2.0.0",
]

[project.scripts]
obol = "obol.cli:main"
obol-mcp = "obol.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obol"]
