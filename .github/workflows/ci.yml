name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:      # release.yml runs this before it publishes anything

# Explicitly read-only. If the repository default is raised to `write` so the
# release workflow can create releases, that default would otherwise apply
# here too - and the test job has no business writing anything.
permissions:
  contents: read

jobs:
  test:
    # The wallet is developed on Windows and will mostly be installed on macOS.
    # Both are in the matrix deliberately: the two bugs this suite exists to
    # catch - the O_BINARY seed write and the cp1252 QR crash - are Windows-only
    # and would pass unnoticed on a Linux-only runner.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Without this the matrix is decorative. `uv sync` picks whatever
          # interpreter the runner happens to ship, so all six jobs tested the
          # same version - 3.12 on Linux and Windows, 3.14 on macOS - and 3.11,
          # the floor declared in requires-python, was never exercised at all.
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --frozen --all-extras --dev

      - name: Tests
        # No network. Every test that would touch a chain lives in probes/ and is
        # run by hand against testnet, because CI must never hold a funded key.
        run: uv run pytest tests/ -q

      - name: Build
        run: uv build

      - name: Install the built wheel into a clean environment
        # Catches the packaging failure the test suite cannot: an asset missing
        # from the wheel. The Algorand mark is loaded via importlib.resources, so
        # it resolves from a source checkout even when it is absent from the
        # distribution.
        shell: bash
        run: |
          uv venv /tmp/fresh
          uv pip install --python /tmp/fresh $(ls dist/*.whl)
          uv run --python /tmp/fresh python -c "
          from obolus.funding import default_logo
          from obolus import __version__
          logo = default_logo()
          assert logo is not None, 'the Algorand mark is missing from the wheel'
          assert logo[:8].hex() == '89504e470d0a1a0a', 'the packaged mark is not a PNG'
          print('wheel ok', __version__, len(logo), 'byte logo')
          "

  plugin:
    # The Claude Code plugin manifests, checked by the same validator the
    # community-marketplace review pipeline runs. Its own job because it needs
    # Claude Code rather than the Python toolchain, and one OS is enough - these
    # are JSON documents, not code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin and the marketplace
        # --strict, so unrecognized fields and missing metadata fail here rather
        # than being tolerated at runtime and rejected at submission.
        run: |
          claude plugin validate ./plugins/obolus --strict
          claude plugin validate . --strict
