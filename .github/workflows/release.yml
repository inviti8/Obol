name: release

# Publishing is driven by a tag, not by a push to main. A release should be a
# thing someone decided to do, with a version they chose, not a side effect of
# merging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # for a dry run without cutting a tag

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test          # nothing reaches PyPI that has not passed on all three OSes
    runs-on: ubuntu-latest
    environment: release # lets a required reviewer be added later without touching this file
    permissions:
      # `write`, not `read`: attaching the distributions creates a GitHub
      # release, and the release API rejects a read-only token with a 403
      # "Resource not accessible by integration". v0.1.0 published to PyPI fine
      # and then failed on exactly this.
      contents: write
      id-token: write    # for trusted publishing, if you switch to it - see below
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the tag matches the version in pyproject.toml
        # A tag that disagrees with the packaged version produces a release
        # nobody can reason about afterwards, and PyPI will not let you replace
        # it. Fail here instead.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv version --short)
          echo "tag=$tag  pyproject=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag does not match version $pkg"; exit 1; }

      - name: Build
        run: uv build

      - name: Publish to PyPI
        # The token is a repository secret named PYPI.
        #
        # TRUSTED PUBLISHING IS BETTER AND WORTH SWITCHING TO. It uses this job's
        # OIDC identity instead of a long-lived token, so there is no secret to
        # leak, rotate or accidentally print. Configure the publisher on PyPI
        # (project -> Publishing -> add a GitHub publisher for this repo and the
        # `release` environment), then replace the line below with:
        #
        #     run: uv publish --trusted-publishing always
        #
        # and delete the PYPI secret.
        # --check-url makes a re-run safe: files already on PyPI are skipped
        # rather than failing the job, so a later step failing does not mean
        # the whole release cannot be retried.
        run: uv publish --token "${{ secrets.PYPI }}" --check-url https://pypi.org/simple/

      - name: Attach the distributions to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Not `dist/*`. `uv build` drops a `.gitignore` containing `*` in there
          # so the directory ignores itself, the glob matched it, and GitHub -
          # which will not take an asset whose name starts with a dot - renamed
          # it to `default.gitignore` and attached it to v0.2.0.
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
