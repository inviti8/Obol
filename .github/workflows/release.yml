name: release

# Publishing is driven by a tag, not by a push to main. A release should be a
# thing someone decided to do, with a version they chose, not a side effect of
# merging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # for a dry run without cutting a tag

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test          # nothing reaches PyPI that has not passed on all three OSes
    runs-on: ubuntu-latest
    environment: release # lets a required reviewer be added later without touching this file
    permissions:
      # `write`, not `read`: attaching the distributions creates a GitHub
      # release, and the release API rejects a read-only token with a 403
      # "Resource not accessible by integration". v0.1.0 published to PyPI fine
      # and then failed on exactly this.
      contents: write
      id-token: write    # for trusted publishing, if you switch to it - see below
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the tag matches the version in pyproject.toml
        # A tag that disagrees with the packaged version produces a release
        # nobody can reason about afterwards, and PyPI will not let you replace
        # it. Fail here instead.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv version --short)
          echo "tag=$tag  pyproject=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag does not match version $pkg"; exit 1; }

      - name: Build
        run: uv build

      - name: Publish to PyPI
        # The token is a repository secret named PYPI.
        #
        # TRUSTED PUBLISHING IS BETTER AND WORTH SWITCHING TO. It uses this job's
        # OIDC identity instead of a long-lived token, so there is no secret to
        # leak, rotate or accidentally print. Configure the publisher on PyPI
        # (project -> Publishing -> add a GitHub publisher for this repo and the
        # `release` environment), then replace the line below with:
        #
        #     run: uv publish --trusted-publishing always
        #
        # and delete the PYPI secret.
        # --check-url makes a re-run safe: files already on PyPI are skipped
        # rather than failing the job, so a later step failing does not mean
        # the whole release cannot be retried.
        run: uv publish --token "${{ secrets.PYPI }}" --check-url https://pypi.org/simple/

      - name: Attach the distributions to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Not `dist/*`. `uv build` drops a `.gitignore` containing `*` in there
          # so the directory ignores itself, the glob matched it, and GitHub -
          # which will not take an asset whose name starts with a dot - renamed
          # it to `default.gitignore` and attached it to v0.2.0.
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

  registry:
    # Separate job, and deliberately after `publish` rather than inside it. The
    # Registry resolves packages[].version against PyPI to prove the package
    # exists, so this cannot run until the upload above has landed - and if the
    # Registry is having a bad day, a red job here must not make a successful
    # PyPI release look failed.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # the OIDC token IS the credential; there is no secret
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help > /dev/null

      - name: Wait for PyPI to serve the new version
        # The upload is not instantly visible to a third party reading the JSON
        # API, and the Registry's check is a hard failure rather than a retry.
        run: |
          want=$(python -c "import json;print(json.load(open('server.json'))['packages'][0]['version'])")
          for i in $(seq 1 30); do
            have=$(curl -sf https://pypi.org/pypi/obolus/json | python -c "import json,sys;print(json.load(sys.stdin)['info']['version'])" || echo none)
            echo "attempt $i: pypi=$have want=$want"
            [ "$have" = "$want" ] && exit 0
            sleep 10
          done
          echo "::error::PyPI never served $want; not publishing to the Registry"
          exit 1

      - name: Publish to the MCP Registry
        # github-oidc, not `login github`: the interactive method is a device
        # code flow that waits for a human at a browser and would hang here.
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher validate
          ./mcp-publisher publish

      - name: Verify it is actually resolvable
        # The CLI printing success is not evidence the entry is readable. This
        # is the same check PUBLISHING.md tells a human to run by hand.
        run: |
          sleep 5
          got=$(curl -s -A 'curl/8.5.0' "https://registry.modelcontextprotocol.io/v0/servers?search=obolus")
          echo "$got" | python -c "
          import json,sys
          d=json.load(sys.stdin)
          names=[s.get('server',s).get('name') for s in d.get('servers',[])]
          print('found:', names)
          assert 'io.github.inviti8/obolus' in names, 'not resolvable in the Registry'
          "
